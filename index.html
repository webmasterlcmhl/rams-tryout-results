<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Rams Tryout Results</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 0;
    }
    .header {
      background: #b00000;
      color: white;
      padding: 20px;
      text-align: center;
      font-size: 28px;
      font-weight: bold;
      text-transform: uppercase;
    }
    .logo {
      display: block;
      margin: 25px auto 10px auto;
      max-width: 300px;
    }
    .notice {
      text-align: center;
      font-size: 18px;
      color: #333;
      margin: 10px auto 20px auto;
      max-width: 900px;
      background: #fff;
      padding: 15px;
      border-radius: 6px;
      border-left: 6px solid #b00000;
      border-right: 6px solid #000000;
    }
    .timestamp {
      text-align: center;
      margin-top: 10px;
      font-size: 16px;
      color: #444;
    }
    .level-box {
      max-width: 900px;
      margin: 30px auto;
      padding: 25px;
      background: #ffffff;
      border-left: 8px solid #b00000;
      border-right: 8px solid #000000;
      border-radius: 6px;
    }
    .level-title {
      font-size: 26px;
      font-weight: bold;
      margin-bottom: 15px;
      color: #b00000;
      text-transform: uppercase;
    }
    .numbers span {
      display: inline-block;
      margin: 8px 12px;
      padding: 10px 16px;
      background: #b00000;
      color: #fff;
      border-radius: 4px;
      font-weight: bold;
      font-size: 20px;
    }
    .fallback {
      font-size: 18px;
      color: #666;
      padding: 10px 0;
      text-align: center;
      font-style: italic;
    }
  </style>
</head>

<body>

  <img src="logo.png" alt="Rams Logo" class="logo">
  <div class="header">Rams Tryout Results</div>

  <div class="notice">
    Player releases will be posted to this page. Please keep an eye on it for roster updates.
  </div>

  <div id="timestamp" class="timestamp"></div>

  <div id="levels"></div>

  <script>
    // --- Generate our own reliable timestamp ---
    const now = new Date();
    const formattedNow = now.toLocaleString("en-CA", {
      dateStyle: "long",
      timeStyle: "short"
    });
    document.getElementById("timestamp").innerHTML = `Last updated: ${formattedNow}`;

    // --- Sheet Data ---
    const sheetID = "1AOU-uDkA6mpJNOwoxjXUP94GYrZAd1q0OIUp14bwagc";
    const jsonURL = `https://docs.google.com/spreadsheets/d/${sheetID}/gviz/tq?tqx=out:json`;

    fetch(jsonURL)
      .then(res => res.text())
      .then(text => {
        const json = JSON.parse(text.substring(47, text.length - 2));
        const rows = json.table.rows;

        let levels = {};

        rows.forEach(row => {
          const jersey = row.c[0]?.v;
          const status = row.c[1]?.v;
          const level = row.c[2]?.v;

          if (!jersey || !status || !level) return;

          if (!levels[level]) levels[level] = [];

          if (status === "InvitedBack") {
            levels[level].push(jersey);
          }
        });

        const container = document.getElementById("levels");

        Object.keys(levels)
          .filter(level => level && level.toLowerCase() !== "team level")
          .sort()
          .forEach(level => {
            const jerseys = levels[level].sort((a, b) => a - b);

            const html = `
              <div class="level-box">
                <div class="level-title">${level} Invited Back</div>
                <div class="numbers">
                  ${
                    jerseys.length > 0
                      ? jerseys.map(num => `<span>${num}</span>`).join("")
                      : `<div class="fallback">No players invited yet.</div>`
                  }
                </div>
              </div>
            `;

            container.innerHTML += html;
          });
      });
  </script>

</body>
</html>
