<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Rams Tryout Results</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 0;
    }
    .header {
      background: #b00000;
      color: white;
      padding: 20px;
      text-align: center;
      font-size: 28px;
      font-weight: bold;
      text-transform: uppercase;
    }
    .timestamp {
      text-align: center;
      margin-top: 10px;
      font-size: 16px;
      color: #444;
    }
    .level-box {
      max-width: 900px;
      margin: 30px auto;
      padding: 25px;
      background: #ffffff;
      border-left: 8px solid #b00000;
      border-right: 8px solid #000000;
      border-radius: 6px;
    }
    .level-title {
      font-size: 26px;
      font-weight: bold;
      margin-bottom: 15px;
      color: #b00000;
      text-transform: uppercase;
    }
    .numbers span {
      display: inline-block;
      margin: 8px 12px;
      padding: 10px 16px;
      background: #b00000;
      color: #fff;
      border-radius: 4px;
      font-weight: bold;
      font-size: 20px;
    }
  </style>
</head>

<body>

  <div class="header">Rams Tryout Results</div>
  <div id="timestamp" class="timestamp">Loading timestamp...</div>

  <div id="levels"></div>

  <script>
    const sheetID = "1AOU-uDkA6mpJNOwoxjXUP94GYrZAd1q0OIUp14bwagc";

    const jsonURL = `https://docs.google.com/spreadsheets/d/${sheetID}/gviz/tq?tqx=out:json`;

    // Your API key (now restricted to Drive API)
    const apiKey = "AIzaSyCUcmrXn78DsTeTR3R7GZxU6V4drORhLcI";

    const metaURL = `https://www.googleapis.com/drive/v3/files/${sheetID}?fields=modifiedTime&key=${apiKey}`;

    // --- Timestamp Fetch ---
    fetch(metaURL)
      .then(res => res.json())
      .then(meta => {
        const updated = new Date(meta.modifiedTime);
        const formatted = updated.toLocaleString("en-CA", {
          dateStyle: "long",
          timeStyle: "short"
        });
        document.getElementById("timestamp").innerHTML = `Last updated: ${formatted}`;
      })
      .catch(() => {
        document.getElementById("timestamp").innerHTML = "Last updated: unavailable";
      });

    // --- Sheet Data Fetch ---
    fetch(jsonURL)
      .then(res => res.text())
      .then(text => {
        const json = JSON.parse(text.substring(47, text.length - 2));
        const rows = json.table.rows;

        let levels = {};

        rows.forEach(row => {
          const jersey = row.c[0]?.v;
          const status = row.c[1]?.v;
          const level = row.c[2]?.v;

          if (!jersey || !status || !level) return;

          if (status === "InvitedBack") {
            if (!levels[level]) levels[level] = [];
            levels[level].push(jersey);
          }
        });

        const container = document.getElementById("levels");

        Object.keys(levels).sort().forEach(level => {
          const jerseys = levels[level].sort((a, b) => a - b);

          const html = `
            <div class="level-box">
              <div class="level-title">${level} Invited Back</div>
              <div class="numbers">
                ${jerseys.map(num => `<span>${num}</span>`).join("")}
              </div>
            </div>
          `;

          container.innerHTML += html;
        });
      });
  </script>

</body>
</html>
