<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Rams Tryout Results</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 0;
    }
    .header {
      background: #b00000;
      color: white;
      padding: 20px;
      text-align: center;
      font-size: 28px;
      font-weight: bold;
      text-transform: uppercase;
    }
    .logo {
      display: block;
      margin: 25px auto 10px auto;
      max-width: 300px;
    }
    .notice {
      text-align: center;
      font-size: 22px;
      font-weight: 700;
      color: #b00000;
      margin: 20px auto 25px auto;
      max-width: 900px;
      background: #fff3f3;
      padding: 20px;
      border-radius: 6px;
      border-left: 8px solid #b00000;
      border-right: 8px solid #000000;
      text-transform: uppercase;
    }
    .timestamp {
      text-align: center;
      margin-top: 10px;
      font-size: 16px;
      color: #444;
    }
    .level-box {
      max-width: 900px;
      margin: 30px auto;
      padding: 25px;
      background: #ffffff;
      border-left: 8px solid #b00000;
      border-right: 8px solid #000000;
      border-radius: 6px;
    }
    .level-title {
      font-size: 26px;
      font-weight: bold;
      margin-bottom: 15px;
      color: #b00000;
      text-transform: uppercase;
    }
    .numbers span {
      display: inline-block;
      margin: 8px 12px;
      padding: 10px 16px;
      background: #b00000;
      color: #fff;
      border-radius: 4px;
      font-weight: bold;
      font-size: 20px;
    }
    .fallback {
      font-size: 18px;
      color: #666;
      padding: 10px 0;
      text-align: center;
      font-style: italic;
    }
    .closing-note {
      margin-top: 20px;
      font-size: 18px;
      color: #333;
      text-align: center;
      line-height: 1.4;
    }
    .closing-note a {
      color: #b00000;
      font-weight: bold;
      text-decoration: none;
    }
  </style>
</head>

<body>

  <img src="RAMS-logo.png" alt="Rams Logo" class="logo">
  <div class="header">Rams Roster Updates</div>

  <div class="notice">
    Roster updates will be posted to this page. Please check back regularly for the latest information.
  </div>

  <div id="timestamp" class="timestamp"></div>

  <div id="levels"></div>

  <script>

    // --- CSV URL ---
    const csvURL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRMa__TQSPEc-Vu7e3My8LTryx9pi_ERDmAJL-l-7hFG4lHzH1Hsl67OUDy27gPV7jbPmc4Q6QeXuI_/pub?output=csv";

    // --- Fetch CSV ---
    fetch(csvURL)
      .then(res => res.text())
      .then(csv => {
        const rows = csv.split("\n").map(r => r.split(","));
        const headers = rows[0].map(h => h.trim());

        // --- Timestamp from sheet ---
        const updatedIndex = headers.indexOf("LastUpdated");
        let lastUpdated = "";

        if (updatedIndex !== -1 && rows.length > 1) {
          lastUpdated = rows[1][updatedIndex].trim();
        }

        document.getElementById("timestamp").innerHTML =
          `Last updated: ${lastUpdated}`;

        // --- Convenor email lookup ---
        const convenorEmails = {
          "U10/U11": "u11convenor@stittsvilleminorhockey.com",
          "U12/U13": "u13convenor@stittsvilleminorhockey.com",
          "U14/U15": "u15convenor@stittsvilleminorhockey.com",
          "U16/U18": "u18convenor@stittsvilleminorhockey.com",
          "U16/U18 (White)": "u18convenor@stittsvilleminorhockey.com",
          "U16/U18 (Black)": "u18convenor@stittsvilleminorhockey.com"
        };

        // --- Existing tryout logic ---
        const jerseyIndex = headers.indexOf("JerseyNumber");
        const statusIndex = headers.indexOf("Status");
        const levelIndex = headers.indexOf("TeamLevel");

        let levels = {};

        for (let i = 1; i < rows.length; i++) {
          const row = rows[i];

          const jersey = row[jerseyIndex]?.trim();
          const status = row[statusIndex]?.trim();
          const level = row[levelIndex]?.trim();

          if (!jersey || !status || !level) continue;

          if (!levels[level]) levels[level] = [];

          if (status === "InvitedBack") {
            levels[level].push(jersey);
          }
        }

        const container = document.getElementById("levels");

        Object.keys(levels)
          .filter(level => level && level.trim() !== "" && level.toLowerCase() !== "teamlevel")
          .sort()
          .forEach(level => {
            const jerseys = levels[level].sort((a, b) => a - b);

            const html = `
              <div class="level-box">
                <div class="level-title">${level} Invited Back</div>
                <div class="numbers">
                  ${
                    jerseys.length > 0
                      ? jerseys.map(num => `<span>${num}</span>`).join("")
                      : `<div class="fallback">No players invited yet.</div>`
                  }
                </div>

                <div class="closing-note">
                  <strong>
                    Thank you for trying. If your number is not listed above, please report to your house league level convenor:
                    <a href="mailto:${convenorEmails[level] || 'info@stittsvilleminorhockey.com'}">
                      ${convenorEmails[level] || 'info@stittsvilleminorhockey.com'}
                    </a>
                  </strong>
                </div>
              </div>
            `;

            container.innerHTML += html;
          });
      });

  </script>

</body>
</html>


</body>
</html>
